name: local_pharmacy
description: Локальная аптека для Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.3
  sensors_plus: ^6.1.2
  vector_math: ^2.2.0
  sqflite: ^2.4.2
  cryptography: ^2.7.0
  mobile_scanner: 7.1.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/capsule/
  shaders:
    - shaders/capsule.frag
    - shaders/liquid_glass.frag
